name: carga-masiva

# El esquema lo crea el runner de database/ (scripts SQL versionados): SQL Server healthy -> database-runner
# completado con éxito -> los cuatro microservicios. Ningún servicio crea ni modifica el esquema al arrancar.
# Si MSSQL_SA_PASSWORD está exportada en el shell, tiene prioridad sobre el valor de .env.
x-app-healthcheck: &app-healthcheck
  test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep -q ' 200 '"]
  interval: 5s
  timeout: 5s
  retries: 30
  start_period: 20s

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-CU27-ubuntu-22.04
    # Las imagenes de SQL Server son amd64; en Apple silicon corre emulada (Microsoft no la soporta
    # oficialmente; ver specs/001-persistencia-integridad-carga/research.md R-11).
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Defina MSSQL_SA_PASSWORD en .env (ver .env.example)}
    ports:
      - "${SQLSERVER_HOST_PORT:-14333}:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "SQLCMDPASSWORD=\"$$MSSQL_SA_PASSWORD\" /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -b -Q 'SELECT 1' >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s

  # Runner de scripts versionados de database/: ejecucion unica; aplica solo las versiones pendientes.
  database-runner:
    build:
      context: ./database
    image: carga-masiva-database-runner:local
    # Reutiliza la imagen del motor (incluye sqlcmd): misma plataforma amd64 emulada.
    platform: linux/amd64
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      DB_HOST: sqlserver
      DB_PORT: "1433"
      DB_NAME: ${DB_NAME:-CargaMasivaApp}
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Defina MSSQL_SA_PASSWORD}
    restart: "no"

  # Intermediario de mensajes (README s2/s4): cola carga_masiva (Feature 005). Gestion en 15672 para la verificacion.
  rabbitmq:
    image: rabbitmq:4.1.8-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?Defina RABBITMQ_USER en .env (ver .env.example)}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Defina RABBITMQ_PASSWORD en .env (ver .env.example)}
    ports:
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 20s
    restart: "no"

  # Almacenamiento de los Excel (README s2/s9): maestro, volumen y filer en un contenedor; filer HTTP en 8888.
  seaweedfs:
    image: chrislusf/seaweedfs:3.97
    command: server -dir=/data -filer
    ports:
      - "8888:8888"
    volumes:
      - seaweedfs-data:/data
    restart: "no"

  ms-control:
    build:
      context: ./ms-control
    image: carga-masiva-ms-control:local
    depends_on:
      database-runner:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      seaweedfs:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: "Server=sqlserver,1433;Database=${DB_NAME:-CargaMasivaApp};User Id=sa;Password=${MSSQL_SA_PASSWORD:?Defina MSSQL_SA_PASSWORD};Encrypt=True;TrustServerCertificate=True"
      Jwt__Clave: ${JWT_CLAVE:?Defina JWT_CLAVE en .env (ver .env.example)}
      Jwt__Emisor: ${JWT_EMISOR:-ms-autenticacion}
      Jwt__Audiencia: ${JWT_AUDIENCIA:-carga-masiva}
      RabbitMq__Host: rabbitmq
      RabbitMq__Puerto: "5672"
      RabbitMq__Usuario: ${RABBITMQ_USER:?Defina RABBITMQ_USER}
      RabbitMq__Clave: ${RABBITMQ_PASSWORD:?Defina RABBITMQ_PASSWORD}
      SeaweedFs__FilerUrl: http://seaweedfs:8888
    ports:
      - "8082:8080"
    volumes:
      - logs-control:/app/logs
    healthcheck: *app-healthcheck
    restart: "no"

  ms-autenticacion:
    build:
      context: ./ms-autenticacion
    image: carga-masiva-ms-autenticacion:local
    depends_on:
      database-runner:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: "Server=sqlserver,1433;Database=${DB_NAME:-CargaMasivaApp};User Id=sa;Password=${MSSQL_SA_PASSWORD:?Defina MSSQL_SA_PASSWORD};Encrypt=True;TrustServerCertificate=True"
      Jwt__Clave: ${JWT_CLAVE:?Defina JWT_CLAVE en .env (ver .env.example)}
      Jwt__Emisor: ${JWT_EMISOR:-ms-autenticacion}
      Jwt__Audiencia: ${JWT_AUDIENCIA:-carga-masiva}
      Jwt__VigenciaAccesoMinutos: ${JWT_VIGENCIA_ACCESO_MINUTOS:-60}
      Jwt__VigenciaRefreshMinutos: ${JWT_VIGENCIA_REFRESH_MINUTOS:-60}
      UsuariosIniciales__Administrador__Email: ${ADMIN_EMAIL:?Defina ADMIN_EMAIL en .env (ver .env.example)}
      UsuariosIniciales__Administrador__Clave: ${ADMIN_CLAVE:?Defina ADMIN_CLAVE en .env (ver .env.example)}
      UsuariosIniciales__Operador__Email: ${OPERADOR_EMAIL:?Defina OPERADOR_EMAIL en .env (ver .env.example)}
      UsuariosIniciales__Operador__Clave: ${OPERADOR_CLAVE:?Defina OPERADOR_CLAVE en .env (ver .env.example)}
    ports:
      - "8081:8080"
    volumes:
      - logs-autenticacion:/app/logs
    healthcheck: *app-healthcheck
    restart: "no"

  ms-carga-masiva:
    build:
      context: ./ms-carga-masiva
    image: carga-masiva-ms-carga-masiva:local
    depends_on:
      database-runner:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      seaweedfs:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: "Server=sqlserver,1433;Database=${DB_NAME:-CargaMasivaApp};User Id=sa;Password=${MSSQL_SA_PASSWORD:?Defina MSSQL_SA_PASSWORD};Encrypt=True;TrustServerCertificate=True"
      RabbitMq__Host: rabbitmq
      RabbitMq__Puerto: "5672"
      RabbitMq__Usuario: ${RABBITMQ_USER:?Defina RABBITMQ_USER}
      RabbitMq__Clave: ${RABBITMQ_PASSWORD:?Defina RABBITMQ_PASSWORD}
      SeaweedFs__FilerUrl: http://seaweedfs:8888
    ports:
      - "8083:8080"
    volumes:
      - logs-carga-masiva:/app/logs
    healthcheck: *app-healthcheck
    restart: "no"

  ms-notificaciones:
    build:
      context: ./ms-notificaciones
    image: carga-masiva-ms-notificaciones:local
    depends_on:
      database-runner:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: "Server=sqlserver,1433;Database=${DB_NAME:-CargaMasivaApp};User Id=sa;Password=${MSSQL_SA_PASSWORD:?Defina MSSQL_SA_PASSWORD};Encrypt=True;TrustServerCertificate=True"
      RabbitMq__Host: rabbitmq
      RabbitMq__Puerto: "5672"
      RabbitMq__Usuario: ${RABBITMQ_USER:?Defina RABBITMQ_USER}
      RabbitMq__Clave: ${RABBITMQ_PASSWORD:?Defina RABBITMQ_PASSWORD}
      Smtp__Host: ${SMTP_HOST:?Defina SMTP_HOST en .env (ver .env.example)}
      Smtp__Puerto: ${SMTP_PUERTO:-587}
      Smtp__Seguridad: ${SMTP_SEGURIDAD:-StartTls}
      Smtp__Usuario: ${SMTP_USUARIO:-}
      Smtp__Clave: ${SMTP_CLAVE:-}
      Smtp__Remitente: ${SMTP_REMITENTE:?Defina SMTP_REMITENTE en .env (ver .env.example)}
    ports:
      - "8084:8080"
    volumes:
      - logs-notificaciones:/app/logs
    healthcheck: *app-healthcheck
    restart: "no"

  # SMTP local de pruebas y demostración (constitución §11 v3.4.0; decisión del usuario, no del README): captura los
  # correos y los muestra en http://localhost:8025, sin entregarlos a buzones externos. SMTP en mailpit:1025 solo en la
  # red interna. Otro servidor SMTP se configura con las variables SMTP_* de .env, sin cambiar código.
  mailpit:
    image: axllent/mailpit:v1.31.6
    ports:
      - "8025:8025"
    restart: "no"

volumes:
  sqlserver-data:
  rabbitmq-data:
  seaweedfs-data:
  logs-control:
  logs-autenticacion:
  logs-carga-masiva:
  logs-notificaciones:
