name: carga-masiva

# El esquema lo crea el runner de database/ (scripts SQL versionados): SQL Server healthy -> database-runner
# completado con éxito -> los cuatro microservicios. Ningún servicio crea ni modifica el esquema al arrancar.
# Si MSSQL_SA_PASSWORD está exportada en el shell, tiene prioridad sobre el valor de .env.
x-app-healthcheck: &app-healthcheck
  test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep -q ' 200 '"]
  interval: 5s
  timeout: 5s
  retries: 30
  start_period: 20s

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-CU27-ubuntu-22.04
    # Las imagenes de SQL Server son amd64; en Apple silicon corre emulada (Microsoft no la soporta
    # oficialmente; ver specs/001-persistencia-integridad-carga/research.md R-11).
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Defina MSSQL_SA_PASSWORD en .env (ver .env.example)}
    ports:
      - "${SQLSERVER_HOST_PORT:-14333}:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "SQLCMDPASSWORD=\"$$MSSQL_SA_PASSWORD\" /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -b -Q 'SELECT 1' >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s

  # Runner de scripts versionados de database/: ejecucion unica; aplica solo las versiones pendientes.
  database-runner:
    build:
      context: ./database
    image: carga-masiva-database-runner:local
    # Reutiliza la imagen del motor (incluye sqlcmd): misma plataforma amd64 emulada.
    platform: linux/amd64
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      DB_HOST: sqlserver
      DB_PORT: "1433"
      DB_NAME: ${DB_NAME:-CargaMasivaApp}
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Defina MSSQL_SA_PASSWORD}
    restart: "no"

  ms-control:
    build:
      context: ./ms-control
    image: carga-masiva-ms-control:local
    depends_on:
      database-runner:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: "Server=sqlserver,1433;Database=${DB_NAME:-CargaMasivaApp};User Id=sa;Password=${MSSQL_SA_PASSWORD:?Defina MSSQL_SA_PASSWORD};Encrypt=True;TrustServerCertificate=True"
    ports:
      - "8082:8080"
    volumes:
      - logs-control:/app/logs
    healthcheck: *app-healthcheck
    restart: "no"

  ms-autenticacion:
    build:
      context: ./ms-autenticacion
    image: carga-masiva-ms-autenticacion:local
    depends_on:
      database-runner:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: "Server=sqlserver,1433;Database=${DB_NAME:-CargaMasivaApp};User Id=sa;Password=${MSSQL_SA_PASSWORD:?Defina MSSQL_SA_PASSWORD};Encrypt=True;TrustServerCertificate=True"
    ports:
      - "8081:8080"
    volumes:
      - logs-autenticacion:/app/logs
    healthcheck: *app-healthcheck
    restart: "no"

  ms-carga-masiva:
    build:
      context: ./ms-carga-masiva
    image: carga-masiva-ms-carga-masiva:local
    depends_on:
      database-runner:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: "Server=sqlserver,1433;Database=${DB_NAME:-CargaMasivaApp};User Id=sa;Password=${MSSQL_SA_PASSWORD:?Defina MSSQL_SA_PASSWORD};Encrypt=True;TrustServerCertificate=True"
    ports:
      - "8083:8080"
    volumes:
      - logs-carga-masiva:/app/logs
    healthcheck: *app-healthcheck
    restart: "no"

  ms-notificaciones:
    build:
      context: ./ms-notificaciones
    image: carga-masiva-ms-notificaciones:local
    depends_on:
      database-runner:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: "Server=sqlserver,1433;Database=${DB_NAME:-CargaMasivaApp};User Id=sa;Password=${MSSQL_SA_PASSWORD:?Defina MSSQL_SA_PASSWORD};Encrypt=True;TrustServerCertificate=True"
    ports:
      - "8084:8080"
    volumes:
      - logs-notificaciones:/app/logs
    healthcheck: *app-healthcheck
    restart: "no"

volumes:
  sqlserver-data:
  logs-control:
  logs-autenticacion:
  logs-carga-masiva:
  logs-notificaciones:
